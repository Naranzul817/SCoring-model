services:
  - type: web
    name: scoring-model-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: APP_PASSWORD
        sync: false   # Render dashboard дээр гараар оруулна, repo-д хадгалахгүй
